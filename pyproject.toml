[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ymd-video-preflight"
version = "0.1.0"
description = "Local video delivery checks with Arabic and English reports"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "YMD Video Preflight contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]

[project.scripts]
ymd-preflight = "ymd_preflight.cli:main"

[tool.setuptools.packages.find]
include = ["ymd_preflight*"]
